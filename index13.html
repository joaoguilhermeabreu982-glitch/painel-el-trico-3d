<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Elétrico 3D - Projeto Integrador</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{overflow:hidden;background-color:#1a1a24;color:white}
#info{position:absolute;top:20px;left:20px;background:rgba(10,10,15,0.85);padding:15px 25px;border-radius:10px;border-left:4px solid #00d2ff;z-index:10;backdrop-filter:blur(5px);pointer-events:none;box-shadow:0 4px 15px rgba(0,0,0,0.7)}
#info h1{font-size:1.3rem;color:#00d2ff;margin-bottom:5px;letter-spacing:1px}
#info p{font-size:0.85rem;color:#aaa}
#controls{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);background:rgba(15,15,25,0.9);padding:12px 25px;border-radius:50px;display:flex;gap:15px;z-index:10;backdrop-filter:blur(5px);border:1px solid #222;box-shadow:0 4px 20px rgba(0,0,0,0.6)}
.btn{background:#1a1a2a;color:#ccc;border:1px solid #333;padding:10px 20px;border-radius:30px;cursor:pointer;transition:all 0.3s;font-weight:600;font-size:0.85rem}
.btn:hover:not(:disabled),.btn.active{background:#00d2ff;color:#000;border-color:#00d2ff;box-shadow:0 0 15px rgba(0,210,255,0.4)}
.btn.btn-simular{border-color:#ff3333;color:#ff3333}
.btn.btn-simular:hover:not(:disabled){background:#ff3333;color:white;box-shadow:0 0 15px rgba(255,51,51,0.4)}
.btn.btn-parar{border-color:#ff9900;color:#ff9900;display:none}
.btn.btn-parar:hover:not(:disabled){background:#ff9900;color:white;box-shadow:0 0 15px rgba(255,153,0,0.4)}
</style>
</head>
<body>
<div id="info"><h1>⚡ Painel de Comando</h1><p>Protótipo Integrador - Falha de Motor</p></div>
<div id="controls">
<button class="btn active" id="btn-fechado">Visão Geral</button>
<button class="btn" id="btn-aberto">Porta Aberta</button>
<button class="btn btn-simular" id="btn-simular">▶ Iniciar Simulação</button>
<button class="btn btn-parar" id="btn-parar">⏹ Parar Simulação</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
let audioCtx,osc,gain,isBuzzer=false,bInt=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function startBuzzer(){if(isBuzzer)return;initAudio();try{osc=audioCtx.createOscillator();gain=audioCtx.createGain();osc.type='square';osc.frequency.setValueAtTime(800,audioCtx.currentTime);bInt=setInterval(()=>{if(isBuzzer&&osc){osc.frequency.setValueAtTime(800,audioCtx.currentTime);osc.frequency.linearRampToValueAtTime(1200,audioCtx.currentTime+0.15);osc.frequency.linearRampToValueAtTime(800,audioCtx.currentTime+0.3);}},300);gain.gain.setValueAtTime(0.06,audioCtx.currentTime);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();isBuzzer=true;}catch(e){console.warn(e);}}
function stopBuzzer(){if(!isBuzzer)return;try{if(bInt){clearInterval(bInt);bInt=null;}if(gain)gain.gain.setValueAtTime(0,audioCtx.currentTime);if(osc){osc.stop(audioCtx.currentTime+0.1);setTimeout(()=>{if(osc){osc.disconnect();osc=null;}if(gain){gain.disconnect();gain=null;}},200);}}catch(e){}isBuzzer=false;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1a24);scene.fog=new THREE.Fog(0x1a1a24,15,45);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,100);camera.position.set(6,4,11);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;controls.target.set(0,2.5,0);controls.maxPolarAngle=Math.PI/2+0.05;
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const mainLight=new THREE.DirectionalLight(0xffffff,1.0);mainLight.position.set(8,12,8);mainLight.castShadow=true;mainLight.shadow.mapSize.width=1024;mainLight.shadow.mapSize.height=1024;mainLight.shadow.camera.near=0.5;mainLight.shadow.camera.far=25;mainLight.shadow.camera.left=-10;mainLight.shadow.camera.right=10;scene.add(mainLight);
const fillLight=new THREE.DirectionalLight(0xffffff,0.4);fillLight.position.set(-8,5,-5);scene.add(fillLight);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x15151e,roughness:0.9,metalness:0.1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const mat={gabinete:new THREE.MeshStandardMaterial({color:0xe0e0e0,metalness:0.5,roughness:0.4}),interno:new THREE.MeshStandardMaterial({color:0x888888,metalness:0.6,roughness:0.5}),trilho:new THREE.MeshStandardMaterial({color:0xb0b0b0,metalness:0.9,roughness:0.2}),preto:new THREE.MeshStandardMaterial({color:0x111111,roughness:0.6}),branco:new THREE.MeshStandardMaterial({color:0xf5f5f5,roughness:0.3}),azul:new THREE.MeshStandardMaterial({color:0x0044ff,roughness:0.4}),cinza:new THREE.MeshStandardMaterial({color:0x555555,roughness:0.5}),cinzaClaro:new THREE.MeshStandardMaterial({color:0xaaaaaa,roughness:0.5}),cobre:new THREE.MeshStandardMaterial({color:0xb87333,metalness:0.9,roughness:0.2}),ledVerde:new THREE.MeshStandardMaterial({color:0x00ff00,emissive:0x00ff00,emissiveIntensity:2}),ledVermelho:new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:0}),metalEscuro:new THREE.MeshStandardMaterial({color:0x2a2a2a,metalness:0.8,roughness:0.2}),motorCorpo:new THREE.MeshStandardMaterial({color:0x1e2a38,metalness:0.7,roughness:0.3}),vidro:new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:0.3,roughness:0.1,transmission:0.9}),fioVermelho:new THREE.MeshStandardMaterial({color:0xff3333,roughness:0.7}),fioAzul:new THREE.MeshStandardMaterial({color:0x3399ff,roughness:0.7}),fioPreto:new THREE.MeshStandardMaterial({color:0x222222,roughness:0.7}),fioVerde:new THREE.MeshStandardMaterial({color:0x00aa00,roughness:0.7}),fioLaranja:new THREE.MeshStandardMaterial({color:0xff8800,roughness:0.7})};

const ledVerdeApagado = new THREE.MeshStandardMaterial({color:0x113311, roughness:0.8});
const ledVermelhoApagado = new THREE.MeshStandardMaterial({color:0x331111, roughness:0.8});

function createLabel(sigla, nome) {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 64);
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, 256, 64);
    ctx.fillStyle = '#000000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (sigla) {
        ctx.font = 'bold 18px Arial'; ctx.fillText(sigla, 128, 20);
        ctx.font = 'bold 22px Arial'; ctx.fillText(nome, 128, 46);
    } else {
        ctx.font = 'bold 24px Arial'; ctx.fillText(nome, 128, 32);
    }
    return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });
}

const cenaGroup=new THREE.Group();scene.add(cenaGroup);const W=4.5,H=5.5,D=1.8;
const gabGroup=new THREE.Group();gabGroup.position.set(-2,0,0);
const fundo=new THREE.Mesh(new THREE.BoxGeometry(W,H,0.1),mat.gabinete);fundo.position.set(0,H/2,-D/2);fundo.castShadow=true;fundo.receiveShadow=true;gabGroup.add(fundo);
const latEsq=new THREE.Mesh(new THREE.BoxGeometry(0.1,H,D),mat.gabinete);latEsq.position.set(-W/2,H/2,0);latEsq.castShadow=true;gabGroup.add(latEsq);
const latDir=new THREE.Mesh(new THREE.BoxGeometry(0.1,H,D),mat.gabinete);latDir.position.set(W/2,H/2,0);latDir.castShadow=true;gabGroup.add(latDir);
const topo=new THREE.Mesh(new THREE.BoxGeometry(W,0.1,D),mat.gabinete);topo.position.set(0,H,0);topo.castShadow=true;gabGroup.add(topo);
const base=new THREE.Mesh(new THREE.BoxGeometry(W,0.1,D),mat.gabinete);base.position.set(0,0,0);base.castShadow=true;base.receiveShadow=true;gabGroup.add(base);
const placaFundo=new THREE.Mesh(new THREE.BoxGeometry(W-0.2,H-0.2,0.05),mat.interno);placaFundo.position.set(0,H/2,-D/2+0.05);placaFundo.receiveShadow=true;gabGroup.add(placaFundo);

function criarVentoinhaEmbutida(x, y, z, rotY) {
    const v = new THREE.Group();
    const moldura = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.25), mat.preto);
    moldura.castShadow = true; v.add(moldura);
    const fundoFuro = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.26, 32), mat.metalEscuro);
    fundoFuro.rotation.x = Math.PI / 2; v.add(fundoFuro);
    const anel = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.03, 16, 32), mat.metalEscuro);
    anel.position.z = 0.13; v.add(anel);
    const heliceGroup = new THREE.Group();
    for(let i=0; i<7; i++) {
        const pa = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.9, 0.03), mat.cinza);
        pa.rotation.z = (Math.PI * 2 / 7) * i;
        pa.rotation.x = 0.4; 
        pa.position.z = 0.05;
        pa.castShadow = true;
        heliceGroup.add(pa);
    }
    v.add(heliceGroup);
    const cubo = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.15, 16), mat.metalEscuro);
    cubo.rotation.x = Math.PI / 2; cubo.position.z = 0.08; v.add(cubo);
    for(let i=-2; i<=2; i++) {
        const gh = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.0, 0.03), mat.metalEscuro);
        gh.position.set(i*0.2, 0, 0.18); v.add(gh);
        const gv = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.03, 0.03), mat.metalEscuro);
        gv.position.set(0, i*0.2, 0.18); v.add(gv);
    }
    v.position.set(x, y, z);
    v.rotation.y = rotY;
    v.userData = { helice: heliceGroup };
    return v;
}
const v1 = criarVentoinhaEmbutida(-W/2, 3.0, 0, Math.PI/2); 
const v2 = criarVentoinhaEmbutida(W/2, 3.0, 0, -Math.PI/2);
gabGroup.add(v1, v2);

function criarTrilho(y,l){const t=new THREE.Mesh(new THREE.BoxGeometry(l,0.1,0.15),mat.trilho);t.position.set(0,y,-D/2+0.15);t.castShadow=true;return t;}
gabGroup.add(criarTrilho(4.3,3.8),criarTrilho(1.8,3.8));

function criarCompBase(w,h,d,x,y,matC,sigla,label,tSup=2,tInf=2){
    const g=new THREE.Group();
    const c=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),matC);c.castShadow=true;c.receiveShadow=true;g.add(c);
    const lG=new THREE.PlaneGeometry(0.7, 0.18);
    const lM=new THREE.Mesh(lG, createLabel(sigla, label));
    lM.position.set(0, h/2 + 0.05, 0.01); 
    g.add(lM);
    for(let i=0;i<tSup;i++){const oX=tSup===1?0:(i-(tSup-1)/2)*(w/(tSup+0.5));const b=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.1,8),mat.cinza);b.rotation.x=Math.PI/2;b.position.set(oX,h/2-0.08,d/2);g.add(b);}
    for(let i=0;i<tInf;i++){const oX=tInf===1?0:(i-(tInf-1)/2)*(w/(tInf+0.5));const b=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.1,8),mat.cinza);b.rotation.x=Math.PI/2;b.position.set(oX,-h/2+0.08,d/2);g.add(b);}
    g.position.set(x,y,-D/2+0.25+d/2);
    return g;
}

// ================= TRILHO SUPERIOR =================

// 1. Disjuntor Bipolar (Esquerda)
const disjuntor=criarCompBase(0.7,1.0,0.5,-1.5,4.3,mat.branco,'','Disjuntor Bipolar',2,2);
const alav=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.15,0.1),mat.azul);alav.position.set(0,0.15,0.25);alav.castShadow=true;disjuntor.add(alav);
gabGroup.add(disjuntor);

// 2. Fonte 24V (Centro)
const fonte=criarCompBase(1.0,1.0,0.6,-0.3,4.3,mat.cinzaClaro,'','Fonte 24V',2,2);
for(let i=0;i<6;i++){const furo=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.4,0.02),mat.preto);furo.position.set(0.5,0,-0.2+i*0.08);fonte.add(furo);}
gabGroup.add(fonte);

// 3. Contatora + Relé Sobrecarga (Direita) -- SUBIRAM PARA CÁ
const contatoraGroup = new THREE.Group();
const cCont = new THREE.Mesh(new THREE.BoxGeometry(0.7,1.0,0.6),mat.branco);cCont.castShadow=true;cCont.receiveShadow=true;contatoraGroup.add(cCont);
const bCont=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.1),mat.preto);bCont.position.set(0,0.2,0.3);contatoraGroup.add(bCont);
const aCont=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.1,0.1),mat.azul);aCont.position.set(0,0.2,0.35);contatoraGroup.add(aCont);
const lCont = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.15), createLabel('', 'Contatora'));
lCont.position.set(0, 0.6, 0.31); contatoraGroup.add(lCont);
// Relé Sobrecarga
const cSobrecarga = new THREE.Mesh(new THREE.BoxGeometry(0.65,0.4,0.55),mat.cinzaClaro);cSobrecarga.position.set(0,-0.6,0);cSobrecarga.castShadow=true;cSobrecarga.receiveShadow=true;contatoraGroup.add(cSobrecarga);
const botaoReset = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.1,16),mat.azul);botaoReset.rotation.x=Math.PI/2;botaoReset.position.set(0,-0.6,0.3);contatoraGroup.add(botaoReset);
const lSobrecarga = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.18), createLabel('', 'Relé Sobrecarga'));
lSobrecarga.position.set(0, -0.9, 0.28); contatoraGroup.add(lSobrecarga);
contatoraGroup.position.set(1.2, 4.6, -D/2 + 0.25 + 0.3);
gabGroup.add(contatoraGroup);


// ================= TRILHO INFERIOR =================

// 4. ESP32 (Esquerda)
const esp32Group = new THREE.Group();
const placaEsp = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.7,0.1), mat.cinzaClaro);
placaEsp.castShadow = true; esp32Group.add(placaEsp);
const chip = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.05), mat.cobre);
chip.position.set(-0.2,0,-0.06); esp32Group.add(chip);
for(let i=0;i<8;i++){
    const pe=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.02),mat.metalEscuro);pe.position.set(-0.55+i*0.12,-0.32,0.06);esp32Group.add(pe);
    const pd=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.02),mat.metalEscuro);pd.position.set(-0.55+i*0.12,0.32,0.06);esp32Group.add(pd);
}
const labelEsp = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2), createLabel('', 'ESP32'));
labelEsp.position.set(0, 0.45, 0.06); esp32Group.add(labelEsp);
esp32Group.position.set(-1.5, 2.2, -D/2+0.15);
gabGroup.add(esp32Group);

// 5. Sensor Hall (Centro-Esquerda)
const hallGroup = new THREE.Group();
const placaHall = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.5,0.1), mat.preto);
placaHall.castShadow = true; hallGroup.add(placaHall);
const labelHall = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.15), createLabel('', 'Sensor Hall'));
labelHall.position.set(0, 0.35, 0.06); hallGroup.add(labelHall);
hallGroup.position.set(-0.4, 2.2, -D/2+0.15);
gabGroup.add(hallGroup);

// 6. LM35 (Centro-Direita)
const lm35Group = new THREE.Group();
const corpoLm35 = new THREE.Mesh(new THREE.BoxGeometry(0.25,0.35,0.1), mat.preto);
corpoLm35.castShadow = true; lm35Group.add(corpoLm35);
const labelLm35 = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.15), createLabel('', 'LM35'));
labelLm35.position.set(0, 0.3, 0.06); lm35Group.add(labelLm35);
lm35Group.position.set(0.3, 2.2, -D/2+0.15);
gabGroup.add(lm35Group);

// 7. Buzzer (Direita)
const buzzerGroup = new THREE.Group();
const corpoBuzzer = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.15, 32), mat.preto);
corpoBuzzer.rotation.x = Math.PI / 2; corpoBuzzer.castShadow = true; buzzerGroup.add(corpoBuzzer);
const furoBuzzer = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.16, 16), mat.cinza);
furoBuzzer.rotation.x = Math.PI / 2; buzzerGroup.add(furoBuzzer);
const labelBuzzer = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.15), createLabel('', 'Buzzer'));
labelBuzzer.position.set(0, 0.4, 0.06); buzzerGroup.add(labelBuzzer);
buzzerGroup.position.set(1.0, 2.2, -D/2+0.15);
gabGroup.add(buzzerGroup);

// Barra de Terminais
const barra=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.4,0.3),mat.branco);barra.position.set(0,0.9,-D/2+0.2);barra.castShadow=true;gabGroup.add(barra);
for(let i=-8;i<=8;i++){const d=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.42,0.32),mat.preto);d.position.set(i*0.2,0.9,-D/2+0.2);gabGroup.add(d);const p=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.02,8),mat.metalEscuro);p.rotation.x=Math.PI/2;p.position.set(i*0.2+0.1,0.9,-D/2+0.32);gabGroup.add(p);}

// ================= FIAÇÃO LÓGICA =================
function criarCaboCurvo(pontos, material) {
    const curve = new THREE.CatmullRomCurve3(pontos);
    const geo = new THREE.TubeGeometry(curve, 32, 0.025, 8, false);
    const mesh = new THREE.Mesh(geo, material);
    mesh.castShadow = true;
    return mesh;
}

// Fiação do Disjuntor para a Barra
gabGroup.add(criarCaboCurvo([new THREE.Vector3(-1.5, 3.8, -D/2+0.4), new THREE.Vector3(-1.5, 1.1, -D/2+0.4)], mat.fioVermelho));
gabGroup.add(criarCaboCurvo([new THREE.Vector3(-1.3, 3.8, -D/2+0.4), new THREE.Vector3(-1.3, 1.1, -D/2+0.4)], mat.fioAzul));

// Fiação da Fonte (24V) para ESP32
gabGroup.add(criarCaboCurvo([new THREE.Vector3(-0.3, 3.8, -D/2+0.4), new THREE.Vector3(-0.3, 3.0, -D/2+0.3), new THREE.Vector3(-1.5, 2.6, -D/2+0.2)], mat.fioVermelho));
gabGroup.add(criarCaboCurvo([new THREE.Vector3(0.0, 3.8, -D/2+0.4), new THREE.Vector3(0.0, 3.0, -D/2+0.3), new THREE.Vector3(-1.3, 2.6, -D/2+0.2)], mat.fioPreto));

// Sinal ESP32 -> Contatora (Laranja)
gabGroup.add(criarCaboCurvo([new THREE.Vector3(-0.9, 2.4, -D/2+0.2), new THREE.Vector3(-0.9, 3.2, -D/2+0.3), new THREE.Vector3(1.2, 3.8, -D/2+0.4)], mat.fioLaranja));

// Sensores Hall e LM35 -> ESP32 (Verde)
gabGroup.add(criarCaboCurvo([new THREE.Vector3(-0.4, 2.4, -D/2+0.2), new THREE.Vector3(-0.4, 2.0, -D/2+0.2), new THREE.Vector3(-1.0, 1.9, -D/2+0.2)], mat.fioVerde));
gabGroup.add(criarCaboCurvo([new THREE.Vector3(0.3, 2.4, -D/2+0.2), new THREE.Vector3(0.3, 1.9, -D/2+0.2), new THREE.Vector3(-1.0, 1.8, -D/2+0.2)], mat.fioVerde));

// Buzzer -> ESP32 (Laranja)
gabGroup.add(criarCaboCurvo([new THREE.Vector3(1.0, 2.3, -D/2+0.2), new THREE.Vector3(1.0, 1.8, -D/2+0.2), new THREE.Vector3(-0.5, 1.7, -D/2+0.2)], mat.fioLaranja));

cenaGroup.add(gabGroup);

const portaGroup=new THREE.Group();portaGroup.position.set(-2-W/2,0,0);
const portaMesh=new THREE.Mesh(new THREE.BoxGeometry(W,H,0.1),mat.gabinete);portaMesh.position.set(W/2,H/2,D/2);portaMesh.castShadow=true;portaGroup.add(portaMesh);
for(let y of [0.5,H-0.5]){const dob=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.3,16),mat.metalEscuro);dob.position.set(0.05,y,D/2);portaGroup.add(dob);}
const fech=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.4,0.1),mat.metalEscuro);fech.position.set(W-0.3,H/2,D/2+0.05);portaGroup.add(fech);

const ledV=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.1,32), ledVerdeApagado);
ledV.rotation.x=Math.PI/2;ledV.position.set(W/2,4.4,D/2+0.1);portaGroup.add(ledV);
const cV=new THREE.Mesh(new THREE.SphereGeometry(0.15,16,16,0,Math.PI*2,0,Math.PI/2),mat.vidro);cV.rotation.x=Math.PI/2;cV.position.set(W/2,4.4,D/2+0.15);portaGroup.add(cV);

const ledR=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,0.1,32), ledVermelhoApagado);
ledR.rotation.x=Math.PI/2;ledR.position.set(W/2,3.5,D/2+0.1);portaGroup.add(ledR);
const cR=new THREE.Mesh(new THREE.SphereGeometry(0.15,16,16,0,Math.PI*2,0,Math.PI/2),mat.vidro);cR.rotation.x=Math.PI/2;cR.position.set(W/2,3.5,D/2+0.15);portaGroup.add(cR);

const buz=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,0.1,16),mat.preto);buz.rotation.x=Math.PI/2;buz.position.set(W/2,2.7,D/2+0.1);portaGroup.add(buz);

const lcdF=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.45,0.05),mat.preto);lcdF.position.set(W/2,1.4,D/2+0.05);portaGroup.add(lcdF);
const lcdCan=document.createElement('canvas');lcdCan.width=256;lcdCan.height=128;const lcdCtx=lcdCan.getContext('2d');const lcdTex=new THREE.CanvasTexture(lcdCan);const lcdS=new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.35),new THREE.MeshBasicMaterial({map:lcdTex}));lcdS.position.set(W/2,1.4,D/2+0.08);portaGroup.add(lcdS);
function updLCD(l1,l2,cor='#33ff33',bg='#1a3a1a'){lcdCtx.fillStyle=bg;lcdCtx.fillRect(0,0,256,128);lcdCtx.fillStyle=cor;lcdCtx.font='bold 28px "Courier New", Courier, monospace';lcdCtx.textAlign='center';lcdCtx.textBaseline='middle';lcdCtx.fillText(l1,128,40);lcdCtx.fillText(l2,128,85);lcdTex.needsUpdate=true;}
updLCD('SISTEMA OK','TEMP: 35°C');cenaGroup.add(portaGroup);

const motorGroup=new THREE.Group();motorGroup.position.set(4.5,1.2,0);
const bM=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.2,1.8),mat.metalEscuro);bM.position.y=0.1;bM.castShadow=true;bM.receiveShadow=true;motorGroup.add(bM);
const cM=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,1.4,32),mat.motorCorpo);cM.rotation.z=Math.PI/2;cM.position.set(0,1.0,0);cM.castShadow=true;motorGroup.add(cM);
for(let i=0;i<6;i++){const a=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.05,0.1),mat.metalEscuro);a.position.set(0,1.0+Math.sin(i)*0.6,0.7);motorGroup.add(a);}
const hM=new THREE.Group();for(let i=0;i<3;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(0.1,1.0,0.05),mat.preto);p.position.set(1.0,1.0,0);p.rotation.x=i*(Math.PI/1.5);hM.add(p);}motorGroup.add(hM);cenaGroup.add(motorGroup);

function criarCaboForca(xo,zo,mat){const p1=new THREE.Vector3(-2-0.5+xo,0.2,-0.5+zo);const p2=new THREE.Vector3(-2-0.5+xo,0.05,1.5);const p3=new THREE.Vector3(2.0,0.05,1.5+zo);const p4=new THREE.Vector3(4.5+xo,0.3,0.5+zo);const path=new THREE.CatmullRomCurve3([p1,p2,p3,p4]);const geo=new THREE.TubeGeometry(path,64,0.05,8,false);const mesh=new THREE.Mesh(geo,mat);mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}
cenaGroup.add(criarCaboForca(-0.1,0.1,mat.fioPreto));
cenaGroup.add(criarCaboForca(0.1,-0.1,mat.fioVermelho));
cenaGroup.add(criarCaboForca(0.3,0.0,mat.fioAzul));

let targetDoorAngle=0,currentDoorAngle=0;
document.getElementById('btn-fechado').addEventListener('click',()=>{document.getElementById('btn-fechado').classList.add('active');document.getElementById('btn-aberto').classList.remove('active');targetDoorAngle=0;controls.target.set(0,2.5,0);camera.position.set(6,4,11);});
document.getElementById('btn-aberto').addEventListener('click',()=>{document.getElementById('btn-aberto').classList.add('active');document.getElementById('btn-fechado').classList.remove('active');targetDoorAngle=-Math.PI/2;controls.target.set(-2,2.5,0);camera.position.set(3,3,9);});

let simState='idle',simTimer=0,tempAtual=35,alarmeAtivo=false;
const btnSimular=document.getElementById('btn-simular'),btnParar=document.getElementById('btn-parar');
function resetarSimulacao(){
    simState='idle';simTimer=0;tempAtual=35;alarmeAtivo=false;
    btnSimular.style.display='block';btnParar.style.display='none';
    btnSimular.textContent='▶ Iniciar Simulação';
    ledV.material = ledVerdeApagado;
    ledR.material = ledVermelhoApagado;
    buz.position.z=D/2+0.1;buz.scale.set(1,1,1);motorGroup.position.x=4.5;updLCD('SISTEMA OK','TEMP: 35°C');stopBuzzer();
}
btnSimular.addEventListener('click',()=>{
    if(simState==='idle'||simState==='fault'){
        initAudio();simState='warming';simTimer=0;tempAtual=35;alarmeAtivo=false;
        btnSimular.style.display='none';btnParar.style.display='block';
        ledV.material = mat.ledVerde;
        ledR.material = ledVermelhoApagado;
    }
});
btnParar.addEventListener('click',resetarSimulacao);

let lastTime=performance.now();
function animate(){
    requestAnimationFrame(animate);
    const timeNow=performance.now();let delta=(timeNow-lastTime)/1000;lastTime=timeNow;
    if(delta>0.1)delta=0.016;
    const elapsedTime=timeNow/1000;
    controls.update();
    currentDoorAngle+=(targetDoorAngle-currentDoorAngle)*0.1;
    portaGroup.rotation.y=currentDoorAngle;
    v1.userData.helice.rotation.z+=delta*15;
    v2.userData.helice.rotation.z+=delta*15;
    
    if(simState==='warming'){
        simTimer+=delta;hM.rotation.x+=delta*20;
        if(simTimer<5){
            updLCD('MOTOR LIGADO','AQUECENDO...');
            ledV.material = (Math.sin(elapsedTime*5) > 0) ? mat.ledVerde : ledVerdeApagado;
        }else{simState='running';}
    }else if(simState==='running'){
        hM.rotation.x+=delta*20;
        if(tempAtual<90)tempAtual+=delta*10;
        updLCD('MOTOR ON',`TEMP: ${Math.floor(tempAtual)}°C`);
        ledV.material = mat.ledVerde;
        
        if(tempAtual>=60&&!alarmeAtivo){
            alarmeAtivo=true;
            startBuzzer();
        }
        
        if(tempAtual>=90){
            simState='fault';
            btnParar.style.display='none';btnSimular.style.display='block';
            btnSimular.textContent='🔄 Reiniciar Simulação';
            updLCD('FALHA CRÍTICA','TEMP: 90°C','#ff3333','#3a1a1a');
            stopBuzzer();
            ledV.material = ledVerdeApagado;
            ledR.material = mat.ledVermelho;
        }
    }else if(simState==='fault'){
        const pisca=(elapsedTime%0.4)>0.2;
        ledR.material = pisca ? mat.ledVermelho : ledVermelhoApagado;
        motorGroup.position.x=4.5+(Math.random()-0.5)*0.05;
    }else{
        ledV.material = ledVerdeApagado;
        ledR.material = ledVermelhoApagado;
    }
    
    if(alarmeAtivo&&simState==='running'){
        if((elapsedTime%0.4)>0.2){
            ledR.material = mat.ledVermelho;
            buz.position.z=D/2+0.1+(Math.random()*0.05);buz.scale.set(1.1,1.1,1.1);
        }else{
            ledR.material = ledVermelhoApagado;
            buz.position.z=D/2+0.1;buz.scale.set(1,1,1);
        }
    }
    renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
animate();
</script>
</body>
</html>
